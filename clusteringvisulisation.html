<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cluster Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
    <style>
        .tooltip {
            position: absolute;
            text-align: left;
            width: auto;
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #aaa;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
        }

        .link {
            fill: none;
            stroke: #ccc;
            stroke-width: 1.5px;
        }

        .node {
            cursor: pointer;
            stroke: #fff;
            stroke-width: 1.5px;
        }
    </style>
</head>
<body>
<h1>Visual Analytics Midterm</h1>
<div id="visualization"></div>
<script>
    function loadExcel(callback) {
        console.log("Loading Excel file...");
        fetch('cars_dataset.xls')
            .then(response => response.arrayBuffer())
            .then(buffer => {
                console.log("Excel file loaded successfully.");
                const data = new Uint8Array(buffer);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                callback(json);
            })
            .catch(error => {
                console.error("Error loading Excel file:", error);
            });
    }

    function visualizeData(data) {
        console.log("Visualizing data...");
        const svg = d3.select("#visualization")
            .append("svg")
            .attr("width", 800)
            .attr("height", 600);

        // Clustering logic goes here
        // For demonstration purposes, let's create random clusters
        const clusters = Array.from({ length: 4 }, (_, i) => data.filter((_, j) => j % 4 === i));

        // Find the largest cluster and count its cars
        const largestCluster = clusters.reduce((acc, curr) => curr.length > acc.length ? curr : acc, []);
        const numberOfCarsInLargestCluster = largestCluster.length;

        // Display the number of cars in the largest cluster
        const clusterInfo = d3.select("#visualization").append("div")
            .attr("class", "cluster-info")
            .text(`Number of cars in the largest cluster: ${numberOfCarsInLargestCluster}`);

        // Generate colors for clusters
        const color = d3.scaleOrdinal(d3.schemeCategory10);

        // Define force simulation
        const simulation = d3.forceSimulation()
            .force("center", d3.forceCenter(400, 300))
            .force("collide", d3.forceCollide(10))
            .force("charge", d3.forceManyBody().strength(5))
            .force("link", d3.forceLink().id(d => d.id).distance(100).strength(0.2));

        // Add nodes to simulation
        const nodes = [];
        clusters.forEach((cluster, i) => {
            cluster.forEach((d, j) => {
                nodes.push({ id: `${i}-${j}`, cluster: i, data: d });
            });
        });
        simulation.nodes(nodes).on("tick", ticked);

        // Add links between nodes of the same color
        const links = [];
        clusters.forEach((cluster, i) => {
            for (let j = 0; j < cluster.length - 1; j++) {
                for (let k = j + 1; k < cluster.length; k++) {
                    links.push({ source: `${i}-${j}`, target: `${i}-${k}` });
                }
            }
        });
        simulation.force("link").links(links);

        // Draw links
        const link = svg.selectAll(".link")
            .data(links)
            .enter().append("line")
            .attr("class", "link");

        // Draw nodes
        const node = svg.selectAll(".node")
            .data(nodes)
            .enter().append("circle")
            .attr("class", "node")
            .attr("r", 5)
            .attr("fill", d => color(d.cluster))
            .call(drag(simulation))
            .on("mouseover", (event, d) => {
                tooltip.transition()
                    .duration(200)
                    .style("opacity", .9);
                tooltip.html(`<b>Model:</b> ${d.data[0]}<br><b>MPG:</b> ${d.data[1]}<br><b>Cylinders:</b> ${d.data[2]}<br><b>Weight:</b> ${d.data[5]}`)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px");
            })
            .on("mouseout", () => {
                tooltip.transition()
                    .duration(500)
                    .style("opacity", 0);
            });

        const tooltip = d3.select("body").append("div")
            .attr("class", "tooltip")
            .style("opacity", 0);

        function ticked() {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
        }

        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }

            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }
    }

    loadExcel(visualizeData);
</script>
</body>
</html>
